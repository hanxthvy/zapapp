# [xihanzu-NR]
[package]
name = "zapapp-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "zapapp_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Cryptography
aes-gcm = "0.11"
ctr = "0.10"
aes = "0.9"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "3.0", features = ["fast", "zeroize"] }
curve25519-dalek = { version = "5.0", features = ["alloc", "precomputed-tables", "zeroize"] }
rand = "0.10"
subtle = "2.6"
thiserror = "2.0"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jni = "0.21"
